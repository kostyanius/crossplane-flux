apiVersion: meta.pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: crossplane-flux
  annotations:
    meta.crossplane.io/maintainer: "Kostyanius <you@example.com>"
    meta.crossplane.io/source: "github.com/<your-org>/my-configuration"
    meta.crossplane.io/license: "Apache-2.0"
    meta.crossplane.io/description: |
      Provides a simplified Database XR that provisions an in-cluster
      Postgres instance (Deployment + Service + PVC) via provider-kubernetes.
    meta.crossplane.io/readme: |
      # my-configuration

      A Composite Resource (XR) that abstracts a local Postgres instance,
      deployed as plain Kubernetes objects inside the same cluster
      (e.g. kind in WSL) via provider-kubernetes's Object resource.
spec:
  crossplane:
    version: ">=v1.14.0-0"
  dependsOn:
    - provider: xpkg.upbound.io/crossplane-contrib/provider-kubernetes
      version: ">=v0.14.0"
    - function: xpkg.upbound.io/crossplane-contrib/function-patch-and-transform
      version: ">=v0.5.0"
